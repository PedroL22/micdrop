<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f13">
  <title>Karaoke · Sessão</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>🎤 Karaoke</h1>
  </header>

  <div class="card">
    <label class="small" for="name">Seu nome (aparece na fila)</label>
    <input type="text" id="name" placeholder="Ex.: Tia Lúcia" maxlength="30" autocomplete="nickname">
  </div>

  <form class="card" id="searchForm">
    <label class="small" for="q">Link do YouTube ou nome da musica</label>
    <div class="row">
      <input type="text" id="q" placeholder="Artista ou música..." autocomplete="off">
      <button class="btn primary">Buscar</button>
    </div>
    <div class="loading" id="searchStatus" hidden></div>
    <div class="list" id="results"></div>
  </form>

  <section id="queueBox" hidden>
    <h2>Músicas a processar</h2>
    <div class="list" id="queue"></div>
  </section>

  <section>
    <h2>Prontas para cantar</h2>
    <div class="list" id="library"></div>
  </section>
</div>

<script src="/static/common.js"></script>
<script>
  const nameInput = $("#name");
  nameInput.value = localStorage.karaokeName || "";
  nameInput.addEventListener("input", () => (localStorage.karaokeName = nameInput.value.trim()));

  setupSearch({ form: $("#searchForm"), input: $("#q"), status: $("#searchStatus"),
                results: $("#results"), getName: () => nameInput.value.trim() });

  let lastQueue = "", lastSongs = "";
  startPolling(async () => {
    const [queue, lib] = await Promise.all([api("/api/queue"), api("/api/songs")]);
    const qs = JSON.stringify(queue);
    if (qs !== lastQueue) {
      lastQueue = qs;
      $("#queueBox").hidden = !queue.length;
      const box = $("#queue");
      box.innerHTML = "";
      for (const j of queue) box.appendChild(queueRow(j));
    }
    const ls = JSON.stringify(lib);
    if (ls !== lastSongs) {
      lastSongs = ls;
      const box = $("#library");
      box.innerHTML = lib.length ? "" : `<div class="empty">Nenhuma música pronta ainda.</div>`;
      for (const s of lib) {
        const row = document.createElement("div");
        row.className = "item";
        row.innerHTML = `
          <img class="thumb" src="${esc(songThumb(s))}" alt="">
          <div class="meta">
            <div class="title">${esc(songTitle(s))}</div>
            <div class="sub">${esc(s.artist || s.channel)}${s.owner_name ? ` · <span class="who">${esc(s.owner_name)}</span>` : ""}</div>
          </div>
          ${s.mine ? `<div class="actions"><button class="btn small icon del" title="Apagar">🗑️</button></div>` : ""}`;
        const del = $(".del", row);
        if (del) del.onclick = async () => {
          if (!confirm(`Apagar "${songTitle(s)}"?`)) return;
          try { await api(`/api/songs/${s.id}`, { method: "DELETE" }); refresh(); }
          catch (e) { toast(e.message); }
        };
        box.appendChild(row);
      }
    }
  });
</script>
</body>
</html>
