<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karaoke</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>🎤 Karaoke 🎹</h1>
    <div class="midi">MIDI Device
      <select id="midi"><option value="">(nenhum)</option></select>
      <button class="btn small" id="ccKey" title="Manda só o CC da nota (para o Learn do Reaper)">CC nota</button>
      <button class="btn small" id="ccScale" title="Manda só o CC da escala (para o Learn do Reaper)">CC escala</button>
    </div>
  </header>

  <details class="card" id="sessionBox">
    <summary>🧮 Entrar na sessão</summary>
    <div class="qr">
      <img src="/qr.svg" alt="QR code da sessão">
      <div>
        <div>Escaneie com o celular para adicionar músicas.</div>
        <div class="url" id="sessionUrl"></div>
        <div class="url">Só funciona para quem estiver no mesmo Wi-Fi.</div>
      </div>
    </div>
  </details>

  <form class="card" id="searchForm">
    <label class="small" for="q">Link do YouTube ou nome da musica</label>
    <div class="row">
      <input type="text" id="q" placeholder="Digite o nome do artista ou música..." autocomplete="off">
      <button class="btn primary">Buscar</button>
    </div>
    <div class="loading" id="searchStatus" hidden></div>
    <div class="list" id="results"></div>
  </form>

  <section id="queueBox" hidden>
    <h2>Músicas a processar</h2>
    <div class="list" id="queue"></div>
  </section>

  <section>
    <h2>Biblioteca <input type="search" id="filter" placeholder="Pesquisar..."></h2>
    <div class="list" id="library"></div>
  </section>
</div>

<script src="/static/common.js"></script>
<script src="/static/index.js"></script>
</body>
</html>
